<svg xmlns="http://www.w3.org/2000/svg"
width="1200"
height="330"
viewBox="0 0 1200 330">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#05080c"/>
    <stop offset="55%" stop-color="#0b1118"/>
    <stop offset="100%" stop-color="#020406"/>
  </linearGradient>

  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#39d353"/>
    <stop offset="50%" stop-color="#7ee787"/>
    <stop offset="100%" stop-color="#39d353"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <pattern id="grid"
           width="40"
           height="40"
           patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40"
          fill="none"
          stroke="#39d353"
          stroke-width="0.6"
          opacity="0.06"/>
  </pattern>

  <pattern id="scanlines"
           width="6"
           height="6"
           patternUnits="userSpaceOnUse">
    <rect width="6" height="1"
          fill="#ffffff"
          opacity="0.025"/>
  </pattern>

</defs>


<!-- BACKGROUND -->

<rect width="100%"
      height="100%"
      rx="24"
      fill="url(#bg)"/>

<rect width="100%"
      height="100%"
      rx="24"
      fill="url(#grid)"/>

<rect width="100%"
      height="100%"
      rx="24"
      fill="url(#scanlines)"/>

<rect x="1"
      y="1"
      width="1198"
      height="328"
      rx="24"
      fill="none"
      stroke="#30363d"
      stroke-width="2"/>


<!-- TOP BAR -->

<circle cx="30" cy="30" r="7" fill="#ff5f56"/>
<circle cx="53" cy="30" r="7" fill="#ffbd2e"/>
<circle cx="76" cy="30" r="7" fill="#27c93f"/>

<text x="105"
      y="35"
      font-family="monospace"
      font-size="13"
      fill="#6e7681">
PROFILE // SYSTEM INITIALIZED
</text>


<!-- MAIN IDENTITY -->

<text x="55"
      y="115"
      font-family="monospace"
      font-size="48"
      font-weight="bold"
      fill="url(#accent)"
      filter="url(#glow)">
SEAN ANDRADES
</text>

<text x="58"
      y="148"
      font-family="monospace"
      font-size="15"
      fill="#8b949e">
COMPUTER ENGINEERING  //  FULL-STACK  //  AI
</text>


<!-- STATUS -->

<circle cx="61"
        cy="190"
        r="6"
        fill="#39d353"
        filter="url(#glow)">

  <animate
    attributeName="opacity"
    values="1;0.25;1"
    dur="1.5s"
    repeatCount="indefinite"/>

</circle>

<text x="78"
      y="195"
      font-family="monospace"
      font-size="13"
      fill="#7ee787">
BUILD STATUS: ACTIVE
</text>


<!-- STACK -->

<text x="58"
      y="235"
      font-family="monospace"
      font-size="11"
      fill="#6e7681">
STACK
</text>

<text x="58"
      y="256"
      font-family="monospace"
      font-size="14"
      fill="#d0d7de">
Python  •  C++  •  JavaScript  •  Next.js
</text>


<text x="58"
      y="286"
      font-family="monospace"
      font-size="11"
      fill="#6e7681">
CURRENT FOCUS
</text>

<text x="160"
      y="286"
      font-family="monospace"
      font-size="14"
      fill="#d0d7de">
AI SYSTEMS  •  CLOUD  •  AUTOMATION
</text>


<!-- RIGHT PANEL -->

<rect x="820"
      y="78"
