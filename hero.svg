      height="180"
      rx="14"
      fill="#0d1117"
      stroke="#30363d"/>

<text x="845"
      y="108"
      font-family="monospace"
      font-size="11"
      fill="#6e7681">
CORE TECHNOLOGIES
</text>

<text x="845"
      y="140"
      font-family="monospace"
      font-size="14"
      fill="#7ee787">
[01] PYTHON
</text>

<text x="845"
      y="170"
      font-family="monospace"
      font-size="14"
      fill="#7ee787">
