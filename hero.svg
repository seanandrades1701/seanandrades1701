</text>

<text x="845"
      y="200"
      font-family="monospace"
      font-size="14"
      fill="#7ee787">
[03] AWS
</text>

<text x="845"
      y="230"
      font-family="monospace"
      font-size="14"
      fill="#7ee787">
[04] AI / ML
</text>


<!-- BOTTOM LINE -->

<line x1="55"
      y1="307"
      x2="1145"
      y2="307"
      stroke="#30363d"/>

<text x="55"
      y="322"
      font-family="monospace"
      font-size="9"
      fill="#484f58">
@seanandrades1701  //  BUILD → BREAK → LEARN → SHIP
</text>

</svg>
